name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python versions per Django release follow Django's official support list
        include:
          - { python-version: "3.10", django-version: "Django>=4.2,<5.0" }
          - { python-version: "3.11", django-version: "Django>=4.2,<5.0" }
          - { python-version: "3.12", django-version: "Django>=4.2,<5.0" }
          - { python-version: "3.10", django-version: "Django>=5.0,<5.1" }
          - { python-version: "3.11", django-version: "Django>=5.0,<5.1" }
          - { python-version: "3.12", django-version: "Django>=5.0,<5.1" }
          - { python-version: "3.10", django-version: "Django>=5.1,<5.2" }
          - { python-version: "3.11", django-version: "Django>=5.1,<5.2" }
          - { python-version: "3.12", django-version: "Django>=5.1,<5.2" }
          - { python-version: "3.13", django-version: "Django>=5.1,<5.2" }
          - { python-version: "3.10", django-version: "Django>=5.2,<6.0" }
          - { python-version: "3.11", django-version: "Django>=5.2,<6.0" }
          - { python-version: "3.12", django-version: "Django>=5.2,<6.0" }
          - { python-version: "3.13", django-version: "Django>=5.2,<6.0" }
          - { python-version: "3.14", django-version: "Django>=5.2,<6.0" }
          - { python-version: "3.12", django-version: "Django>=6.0,<6.1" }
          - { python-version: "3.13", django-version: "Django>=6.0,<6.1" }
          - { python-version: "3.14", django-version: "Django>=6.0,<6.1" }
          - { python-version: "3.12", django-version: "Django>=6.1,<6.2" }
          - { python-version: "3.13", django-version: "Django>=6.1,<6.2" }
          - { python-version: "3.14", django-version: "Django>=6.1,<6.2" }
          - { python-version: "3.15", django-version: "Django>=6.1,<6.2" }
          # newest alpha/beta/rc of the next release; equals latest stable between pre-release cycles
          - { python-version: "3.15", django-version: "Django>=6.1,<7.0", pre: true }
          - { python-version: "3.15", django-version: "git+https://github.com/django/django.git@main" }

    steps:
    - uses: actions/checkout@v4
      if: ${{ !env.ACT }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Create isolated virtualenv
      run: |
        python -m venv /tmp/venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}

    - name: Install dependencies
      run: |
        source /tmp/venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/bin/activate
        pip install -q --upgrade pip
        pip install -q ${{ matrix.pre && '--pre' || '' }} "${{ matrix.django-version }}"
        pip install -q -e ".[test]"

    - name: Lint with flake8
      run: |
        source /tmp/venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/bin/activate
        flake8 django_permanent

    - name: Run tests with coverage
      continue-on-error: ${{ contains(matrix.django-version, 'git+https://') || matrix.pre == true }}
      env:
        COVERAGE_FILE: /tmp/.coverage-${{ github.run_id }}-${{ strategy.job-index }}
        TEST_VERBOSITY: 2
      run: |
        source /tmp/venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/bin/activate
        coverage run runtests.py

    - name: Coverage report (CI)
      if: matrix.python-version == '3.12' && matrix.django-version == 'Django>=6.1,<6.2' && !env.ACT
      continue-on-error: true
      env:
        COVERAGE_FILE: /tmp/.coverage-${{ github.run_id }}-${{ strategy.job-index }}
      run: |
        source /tmp/venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/bin/activate
        if [ -f "$COVERAGE_FILE" ]; then
          coverage report --skip-covered --skip-empty --precision=1
        else
          echo "No coverage file found at $COVERAGE_FILE"
        fi

    - name: Coverage report (act - detailed)
      if: matrix.python-version == '3.12' && matrix.django-version == 'Django>=6.1,<6.2' && env.ACT
      continue-on-error: true
      env:
        COVERAGE_FILE: /tmp/.coverage-${{ github.run_id }}-${{ strategy.job-index }}
      run: |
        source /tmp/venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/bin/activate
        if [ -f "$COVERAGE_FILE" ]; then
          coverage report -m --skip-covered --skip-empty --precision=2
        else
          echo "No coverage file found at $COVERAGE_FILE"
        fi

    - name: Upload coverage to Coveralls
      if: matrix.python-version == '3.12' && matrix.django-version == 'Django>=6.1,<6.2' && !env.ACT
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        COVERAGE_FILE: /tmp/.coverage-${{ github.run_id }}-${{ strategy.job-index }}
      run: |
        source /tmp/venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/bin/activate
        pip install -q coveralls
        coveralls
